<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SDAH | Swiss–Korea Intelligence</title><meta name="description" content="SDAH editorial intelligence on Swiss digital finance and Korean institutions."><style>:root{--paper:#fbfaf7;--ink:#1c2221;--red:#b0282f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.7 Arial,sans-serif}main,header{max-width:1000px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #d8d3c9}a{color:inherit}h1,h2{font:normal clamp(30px,4vw,54px)/1.12 Georgia,serif}h2{font-size:30px}article{padding:30px 0;border-bottom:1px solid #d8d3c9}.meta{color:var(--red);font-size:13px;letter-spacing:.07em;text-transform:uppercase}.muted{color:#626762}.actions{display:flex;gap:14px}button{border:1px solid #aaa;background:transparent;padding:7px 12px;cursor:pointer}button.active{border-color:var(--red);color:var(--red)}section{margin:24px 0}a:focus-visible,button:focus-visible{outline:2px solid var(--red)}.source{overflow-wrap:anywhere}</style></head><body><header><a href="index.html#intelligence">← SWISS DIGITAL ASSET HUB</a><div class="actions"><button id="en" class="active">EN</button><button id="ko">KR</button></div></header><main><div class="meta">SDAH / INTELLIGENCE</div><h1 id="page-title">Swiss–Korea Digital Finance Intelligence</h1><p class="muted" id="intro">Independent analysis of Swiss developments and implications for Korean financial institutions. Editorially reviewed by SDAH.</p><div id="content" aria-live="polite">Loading…</div></main><script>
let lang=localStorage.getItem('sdah-language')==='ko'?'ko':'en',articles=[];
const el=document.getElementById('content');
const txt=(a,k)=>(a[k+'_'+lang]||a[k+'_en']||'');
function node(tag,text,cls){const x=document.createElement(tag);x.textContent=text||'';if(cls)x.className=cls;return x}
function ext(url,label){const a=node('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a}
function render(){document.documentElement.lang=lang;document.querySelectorAll('.actions button').forEach(b=>b.classList.toggle('active',b.id===lang));document.getElementById('page-title').textContent=lang==='ko'?'스위스–한국 디지털 금융 인텔리전스':'Swiss–Korea Digital Finance Intelligence';document.getElementById('intro').textContent=lang==='ko'?'SDAH 검토를 거친 스위스 금융시장 변화와 한국 금융기관에 대한 시사점':'Independent analysis of Swiss developments and implications for Korean financial institutions. Editorially reviewed by SDAH.';el.replaceChildren();const id=new URLSearchParams(location.search).get('article');const chosen=id?articles.filter(a=>a.id===id):articles;if(!chosen.length){el.append(node('p',lang==='ko'?'게시된 분석이 아직 없습니다.':'No approved analysis available yet.'));return}chosen.forEach(a=>{const article=node('article');article.append(node('div',(a.category||'Swiss Finance')+' · '+(a.published_at||'').slice(0,10),'meta'),node('h2',txt(a,'title')),node('p',txt(a,'summary')));if(id){for(const [key,en,ko] of [['facts','Key developments','주요 내용'],['korea_impact','Implications for Korean institutions','한국 금융기관에 대한 시사점'],['opportunities','Potential opportunities','잠재적 사업 기회'],['caveats','Risks and open questions','위험 및 확인 사항']]){const v=txt(a,key);if(v){const s=node('section');s.append(node('h3',lang==='ko'?ko:en),node('p',v));article.append(s)}}}else{const a=node('a',lang==='ko'?'분석 읽기 →':'Read analysis →');a.href='?article='+encodeURIComponent(a.id);article.append(a)}const source=node('p','','source');source.append(node('span',lang==='ko'?'원문: ':'Original source: '),ext(a.source_url,a.source_name||'Official announcement'));article.append(source);el.append(article)});if(id)el.append(ext('intelligence.html',lang==='ko'?'← 전체 분석':'← All analysis'))}
document.getElementById('en').onclick=()=>{lang='en';localStorage.setItem('sdah-language',lang);render()};document.getElementById('ko').onclick=()=>{lang='ko';localStorage.setItem('sdah-language',lang);render()};fetch('data/articles.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{articles=Array.isArray(d.articles)?d.articles:[];render()}).catch(()=>{articles=[];render()});
</script></body></html>
