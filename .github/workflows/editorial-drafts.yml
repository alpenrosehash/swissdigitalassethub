name: SDAH Free Swiss News Collection

'on':
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * 1-5'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free RSS dependencies
        run: python -m pip install 'feedparser>=6,<7' 'requests>=2,<3'
      - name: Collect public RSS headlines only
        env:
          MAX_ITEMS: '30'
        run: python scripts/collect_free.py
      - name: Propose collected headlines for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- data/news_candidates.json)" ]; then
            echo 'No changes to review'
            exit 0
          fi
          branch="news/candidates-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add data/news_candidates.json
          git commit -m 'Collect Swiss finance news candidates'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title 'Review: Swiss finance news candidates' --body 'Unreviewed RSS headlines and excerpts only. No AI analysis. Merging does NOT publish to the website. Review sources, then write bilingual analysis and publish separately.'
